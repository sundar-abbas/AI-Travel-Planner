[project]
name = "ai-travel-planner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Sundar Abbas", email = "chughtaiabbas486@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.4.4",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.7.0",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.65.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
ai-travel-planner = "ai_travel_planner:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
